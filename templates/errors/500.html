{% extends "base.html" %}
{% block title %}Ошибка сервера (500){% endblock %}
{% block content %}
<div style="max-width: 560px; margin: 3rem auto; text-align: center;">
  <div class="card">
    <h1 style="font-size: 3rem; color: var(--color-danger); margin-bottom: 0.5rem;">500</h1>
    <h2 style="font-size: 1.25rem; margin-bottom: 1rem;">Внутренняя ошибка сервиса</h2>
    <p style="color: var(--color-text-secondary); margin-bottom: 1.5rem;">
      {{ error if error else 'Произошла непредвиденная ошибка при обработке запроса. Информация передана в журнал аудита.' }}
    </p>
    <a href="{{ url_for('tickets.index') }}" class="btn btn-primary">Вернуться на главную страницу</a>
  </div>
</div>
{% endblock %}
