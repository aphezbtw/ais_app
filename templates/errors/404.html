{% extends "base.html" %}
{% block title %}Страница не найдена (404){% endblock %}
{% block content %}
<div style="max-width: 560px; margin: 3rem auto; text-align: center;">
  <div class="card">
    <h1 style="font-size: 3rem; color: var(--color-primary); margin-bottom: 0.5rem;">404</h1>
    <h2 style="font-size: 1.25rem; margin-bottom: 1rem;">Запись или страница не найдена</h2>
    <p style="color: var(--color-text-secondary); margin-bottom: 1.5rem;">
      Запрашиваемый ресурс был удалён или никогда не существовал.
    </p>
    <a href="{{ url_for('tickets.index') }}" class="btn btn-primary">Вернуться в реестр</a>
  </div>
</div>
{% endblock %}
